<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈夫曼树分步生成器（紧凑无重叠版）</title>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293bcc;
    --primary:#38bdf8;
    --accent:#8b5cf6;
    --text:#f8fafc;
    --sub:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Segoe UI,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:2.2rem;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--accent)
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.panel{
    max-width:1400px;
    margin:auto;

    background:var(--panel);

    padding:25px;

    border-radius:18px;

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

input[type="number"]{

    width:120px;

    padding:12px 14px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,0.1);

    background:#0f172acc;

    color:white;

    font-size:1rem;

    outline:none;
}

input[type="number"]:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 3px rgba(56,189,248,0.2);
}

button{

    border:none;

    cursor:pointer;

    padding:12px 20px;

    border-radius:10px;

    font-weight:600;

    transition:0.25s;
}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
}

.primary{

    background:linear-gradient(
        135deg,
        #38bdf8,
        #0284c7
    );

    color:white;
}

.success{

    background:linear-gradient(
        135deg,
        #10b981,
        #059669
    );

    color:white;
}

.secondary{

    background:rgba(255,255,255,0.08);

    color:white;

    border:1px solid rgba(255,255,255,0.08);
}

#inputsGrid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(120px,1fr));

    gap:12px;

    margin-top:20px;
}

.input-item{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.input-item label{

    color:var(--sub);

    font-size:0.85rem;
}

#infoBox{

    margin-top:20px;

    padding:16px 18px;

    border-radius:12px;

    background:#0f172acc;

    border-left:4px solid var(--primary);

    font-weight:600;
}

.canvas-wrap{

    max-width:1400px;

    margin:25px auto 0;

    overflow:auto;

    border-radius:18px;

    border:1px solid rgba(255,255,255,0.08);

    background:#0f172a;
}

canvas{
    display:block;
}

::-webkit-scrollbar{
    width:10px;
    height:10px;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.15);
    border-radius:5px;
}

</style>
</head>

<body>

<h1>🌳 哈夫曼树分步生成器</h1>

<div class="panel">

    <div class="row">

        <span>节点数量：</span>

        <input
            type="number"
            id="countInput"
            min="2"
            max="10"
            placeholder="2-10"
        >

        <button
            class="success"
            id="btnGenerate"
        >
            生成输入框
        </button>

    </div>

    <div id="inputsGrid"></div>

    <div class="row" style="margin-top:25px;">

        <button
            class="primary"
            id="btnStart"
            disabled
        >
            开始构建
        </button>

        <button
            class="primary"
            id="btnNext"
            disabled
        >
            执行下一步
        </button>

        <button
            class="secondary"
            id="btnReset"
        >
            重置
        </button>

    </div>

    <div id="infoBox">
        请输入节点数量开始...
    </div>

</div>

<div class="canvas-wrap">
    <canvas id="canvas"></canvas>
</div>


<script>

/* =====================================
   节点类
===================================== */

class Node{

    constructor(value,left=null,right=null){

        this.value=value;

        this.left=left;

        this.right=right;

        this.x=0;

        this.y=0;

        /* 子树宽度 */
        this.width=0;
    }
}


/* =====================================
   DOM
===================================== */

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

const countInput=document.getElementById("countInput");

const btnGenerate=document.getElementById("btnGenerate");

const btnStart=document.getElementById("btnStart");

const btnNext=document.getElementById("btnNext");

const btnReset=document.getElementById("btnReset");

const inputsGrid=document.getElementById("inputsGrid");

const infoBox=document.getElementById("infoBox");


/* =====================================
   核心参数（已优化为紧凑版）
===================================== */

const NODE_RADIUS=26;        // 节点大小不变
const LEVEL_HEIGHT=110;      // 垂直层高（从150→110，大幅缩短垂直线段）
const SAFE_GAP=60;           // 节点安全间距（从90→60，大幅缩短水平线段）
const TREE_GAP=100;          // 树之间距离（从180→100，初始森林更紧凑）
const PADDING=60;            // 画布边距（从120→60，减少空白）


/* =====================================
   状态
===================================== */

let steps=[];

let currentStep=0;


/* =====================================
   输入框
===================================== */

btnGenerate.onclick=()=>{

    const count=parseInt(countInput.value);

    if(isNaN(count)||count<2){

        alert("请输入至少2个节点");

        return;
    }

    if(count>10){

        alert("建议不要超过10个节点");

        return;
    }

    inputsGrid.innerHTML="";

    for(let i=0;i<count;i++){

        const div=document.createElement("div");

        div.className="input-item";

        div.innerHTML=`
            <label>节点 ${i+1}</label>
            <input type="number" class="numInput">
        `;

        inputsGrid.appendChild(div);
    }

    btnStart.disabled=false;

    infoBox.textContent=
        "请输入所有节点权重";
};


/* =====================================
   深拷贝
===================================== */

function deepCopy(node){

    if(!node) return null;

    return new Node(
        node.value,
        deepCopy(node.left),
        deepCopy(node.right)
    );
}


/* =====================================
   树深度
===================================== */

function getDepth(node){

    if(!node) return 0;

    return 1+Math.max(
        getDepth(node.left),
        getDepth(node.right)
    );
}


/* =====================================
   构建步骤
===================================== */

btnStart.onclick=()=>{

    const inputs=
        document.querySelectorAll(".numInput");

    const nums=[];

    for(let input of inputs){

        const val=parseInt(input.value);

        if(isNaN(val)){

            alert("请填写全部数字");

            return;
        }

        nums.push(val);
    }

    steps=[];

    currentStep=0;

    let forest=nums.map(
        n=>new Node(n)
    );

    steps.push({

        forest:forest.map(
            t=>deepCopy(t)
        ),

        msg:`初始节点：[${nums.join(", ")}]`
    });


    while(forest.length>1){

        forest.sort(
            (a,b)=>a.value-b.value
        );

        const left=forest.shift();

        const right=forest.shift();

        const parent=new Node(
            left.value+right.value,
            left,
            right
        );

        forest.push(parent);

        steps.push({

            forest:forest.map(
                t=>deepCopy(t)
            ),

            msg:
            `合并 ${left.value} 和 ${right.value} -> ${parent.value}`
        });
    }

    btnStart.disabled=true;

    btnNext.disabled=false;

    infoBox.textContent=
        "点击“执行下一步”";

    drawForest(steps[0].forest);
};


/* =====================================
   下一步
===================================== */

btnNext.onclick=()=>{

    currentStep++;

    if(currentStep>=steps.length){

        btnNext.disabled=true;

        infoBox.textContent=
            "🎉 哈夫曼树构建完成";

        return;
    }

    const state=steps[currentStep];

    infoBox.textContent=
        `步骤 ${currentStep}: ${state.msg}`;

    drawForest(state.forest);
};


/* =====================================
   重置
===================================== */

btnReset.onclick=()=>{

    steps=[];

    currentStep=0;

    inputsGrid.innerHTML="";

    canvas.width=0;

    canvas.height=0;

    btnStart.disabled=true;

    btnNext.disabled=true;

    countInput.value="";

    infoBox.textContent=
        "请输入节点数量开始...";
};



/* =====================================
   核心：计算子树宽度
===================================== */

function calculateWidth(node){

    if(!node) return 0;

    /* 叶子节点 */
    if(!node.left&&!node.right){

        node.width=
            NODE_RADIUS*2+
            SAFE_GAP;

        return node.width;
    }

    const leftWidth=
        calculateWidth(node.left);

    const rightWidth=
        calculateWidth(node.right);

    node.width=
        leftWidth+
        rightWidth+
        SAFE_GAP;

    return node.width;
}



/* =====================================
   无重叠布局算法
===================================== */

function setPosition(node,leftBound,depth){

    if(!node) return;

    node.y=
        PADDING+
        depth*LEVEL_HEIGHT;

    /* 父节点放在子树中间 */
    node.x=
        leftBound+
        node.width/2;

    /* 左子树 */
    if(node.left){

        setPosition(
            node.left,
            leftBound,
            depth+1
        );
    }

    /* 右子树 */
    if(node.right){

        const rightStart=
            leftBound+
            (node.left?node.left.width:0)+
            SAFE_GAP;

        setPosition(
            node.right,
            rightStart,
            depth+1
        );
    }
}



/* =====================================
   绘制树
===================================== */

function drawTree(node){

    if(!node) return;

    /* ===== 连线 ===== */

    ctx.strokeStyle="#e2e8f0";

    ctx.lineWidth=3;

    ctx.lineCap="round";

    if(node.left){

        ctx.beginPath();

        ctx.moveTo(
            node.x,
            node.y+NODE_RADIUS
        );

        ctx.lineTo(
            node.left.x,
            node.left.y-NODE_RADIUS
        );

        ctx.stroke();

        drawTree(node.left);
    }

    if(node.right){

        ctx.beginPath();

        ctx.moveTo(
            node.x,
            node.y+NODE_RADIUS
        );

        ctx.lineTo(
            node.right.x,
            node.right.y-NODE_RADIUS
        );

        ctx.stroke();

        drawTree(node.right);
    }


    /* ===== 阴影 ===== */

    ctx.beginPath();

    ctx.arc(
        node.x+4,
        node.y+4,
        NODE_RADIUS,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(0,0,0,0.35)";

    ctx.fill();


    /* ===== 渐变 ===== */

    const gradient=
        ctx.createRadialGradient(
            node.x-8,
            node.y-8,
            5,
            node.x,
            node.y,
            NODE_RADIUS
        );

    gradient.addColorStop(0,"#60a5fa");

    gradient.addColorStop(1,"#6366f1");

    ctx.beginPath();

    ctx.arc(
        node.x,
        node.y,
        NODE_RADIUS,
        0,
        Math.PI*2
    );

    ctx.fillStyle=gradient;

    ctx.fill();


    /* ===== 边框 ===== */

    ctx.strokeStyle="#f8fafc";

    ctx.lineWidth=3;

    ctx.stroke();


    /* ===== 文字 ===== */

    ctx.fillStyle="white";

    ctx.font="bold 16px Inter";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        node.value,
        node.x,
        node.y
    );
}



/* =====================================
   绘制森林
===================================== */

function drawForest(forest){

    if(!forest||forest.length===0)
        return;

    let totalWidth=0;

    let maxDepth=0;


    /* 计算所有树宽度 */

    forest.forEach(tree=>{

        calculateWidth(tree);

        totalWidth+=
            tree.width+
            TREE_GAP;

        maxDepth=Math.max(
            maxDepth,
            getDepth(tree)
        );
    });


    canvas.width=Math.max(
        totalWidth+PADDING*2,
        1000  // 最小画布宽度（从1600→1000）
    );

    canvas.height=
        maxDepth*LEVEL_HEIGHT+
        PADDING*2;


    /* 背景 */

    const bg=
        ctx.createLinearGradient(
            0,
            0,
            canvas.width,
            canvas.height
        );

    bg.addColorStop(0,"#0f172a");

    bg.addColorStop(1,"#111827");

    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* 绘制多棵树 */

    let currentLeft=PADDING;

    forest.forEach(tree=>{

        setPosition(
            tree,
            currentLeft,
            0
        );

        drawTree(tree);

        currentLeft+=
            tree.width+
            TREE_GAP;
    });
}

</script>

</body>
</html>
