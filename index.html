<style>
    :root {

<body>

<h1>🌳 哈夫曼树分步生成器</h1>

<div class="panel">

    <div class="row">
        <span class="label">节点数量：</span>
        <input type="number" id="countInput" min="2" max="30"/>
        <button class="btn-success" id="btnGenerate">
            生成输入框
        </button>
    </div>

    <div id="inputsGrid"></div>

    <div class="row" style="margin-top:25px;">
        <button class="btn-primary" id="btnStart" disabled>
            开始构建
        </button>

        <button class="btn-primary" id="btnNext" disabled>
            执行下一步
        </button>

        <button class="btn-secondary" id="btnReset">
            重置
        </button>
    </div>

    <div id="infoBox">
        请输入节点数量开始...
    </div>

</div>

<div class="canvas-wrap">
    <canvas id="canvas"></canvas>
</div>

<script>

class Node {
    constructor(value, left = null, right = null) {
        this.value = value;
        this.left = left;
        this.right = right;

        this.x = 0;
        this.width = 0;
    }
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const countInput = document.getElementById("countInput");
const btnGenerate = document.getElementById("btnGenerate");
const btnStart = document.getElementById("btnStart");
const btnNext = document.getElementById("btnNext");
const btnReset = document.getElementById("btnReset");
const inputsGrid = document.getElementById("inputsGrid");
const infoBox = document.getElementById("infoBox");

let steps = [];
let currentStep = 0;

/* ======== 布局参数 ======== */

const NODE_RADIUS = 26;

/* 横向最小安全距离 */
const MIN_NODE_SAFE_SPACE = 90;

/* 纵向层高（决定线段长度） */
const LEVEL_HEIGHT = 170;

/* 森林树间距 */
const FOREST_GAP = 140;

/* 画布边距 */
const PADDING = 100;

/* ========================= */


/* 生成输入框 */
btnGenerate.onclick = () => {

    const count = parseInt(countInput.value);

    if (isNaN(count) || count < 2) {
        alert("请输入至少2个节点");
        return;
    }

    if (count > 30) {
        alert("建议不要超过30个节点");
        return;
    }

    inputsGrid.innerHTML = "";

    for (let i = 0; i < count; i++) {

        const div = document.createElement("div");

        div.className = "input-item";

        div.innerHTML = `
            <label>节点 ${i + 1}</label>
            <input type="number" class="numInput">
        `;

        inputsGrid.appendChild(div);
    }

    btnStart.disabled = false;

    infoBox.textContent = "请输入所有节点权重";
};


/* 深拷贝 */
function deepCopy(node) {

    if (!node) return null;

    return new Node(
        node.value,
        deepCopy(node.left),
        deepCopy(node.right)
    );
}


/* 树深度 */
function getDepth(node) {

    if (!node) return 0;

    return 1 + Math.max(
        getDepth(node.left),
        getDepth(node.right)
    );
}


/* 开始构建 */
btnStart.onclick = () => {

    const inputs = document.querySelectorAll(".numInput");

    const nums = [];

    for (let input of inputs) {

        const val = parseInt(input.value);

        if (isNaN(val)) {
            alert("请填写全部数字");
            return;
        }

        nums.push(val);
    }

    steps = [];
    currentStep = 0;

    let forest = nums.map(n => new Node(n));

    steps.push({
        forest: forest.map(t => deepCopy(t)),
        msg: `初始节点：[${nums.join(", ")}]`
    });

    while (forest.length > 1) {

        forest.sort((a,b)=>a.value-b.value);

        const left = forest.shift();
        const right = forest.shift();

        const parent = new Node(
            left.value + right.value,
            left,
            right
        );

        forest.push(parent);

        steps.push({
            forest: forest.map(t => deepCopy(t)),
            msg: `合并 ${left.value} 和 ${right.value} -> ${parent.value}`
        });
    }

    btnNext.disabled = false;
    btnStart.disabled = true;

    infoBox.textContent = "点击“执行下一步”";

    drawForest(steps[0].forest);
};


/* 下一步 */
btnNext.onclick = () => {

    currentStep++;

    if (currentStep >= steps.length) {

        btnNext.disabled = true;

        infoBox.textContent = "🎉 哈夫曼树构建完成";

        return;
    }

    const state = steps[currentStep];

    infoBox.textContent =
        `步骤 ${currentStep}: ${state.msg}`;

    drawForest(state.forest);
};


/* 重置 */
btnReset.onclick = () => {

    steps = [];
    currentStep = 0;

    inputsGrid.innerHTML = "";

    btnStart.disabled = true;
    btnNext.disabled = true;

    countInput.value = "";

    canvas.width = 0;
    canvas.height = 0;

    infoBox.textContent = "请输入节点数量开始...";
};



/* =========================
   核心布局算法（无重叠版）
========================= */

function calculateLayout(node) {

    /* 叶子节点 */
    if (!node.left && !node.right) {

        node.width =
            NODE_RADIUS * 2 +
            MIN_NODE_SAFE_SPACE;

        node.x = node.width / 2;

        return node.width;
    }

    const leftWidth =
        node.left ? calculateLayout(node.left) : 0;

    const rightWidth =
        node.right ? calculateLayout(node.right) : 0;

    const gap = Math.max(
        MIN_NODE_SAFE_SPACE,
        NODE_RADIUS * 2 + 20
    );

    node.width =
        leftWidth +
        gap +
        rightWidth;

    const leftCenter = leftWidth / 2;

    const rightCenter =
        leftWidth +
        gap +
        rightWidth / 2;

    /* 父节点位于左右孩子正中 */
    node.x =
        (leftCenter + rightCenter) / 2;

    return node.width;
}



/* =========================
   绘制树
========================= */

function drawTree(node, baseY, offsetX) {

    if (!node) return;

    const actualX = offsetX + node.x;
    const actualY = baseY;

    /* ===== 左孩子 ===== */

    if (node.left) {

        const leftOffsetX = offsetX;

        const childX =
            leftOffsetX + node.left.x;

        const childY =
            baseY + LEVEL_HEIGHT;

        ctx.beginPath();

        ctx.moveTo(
            actualX,
            actualY + NODE_RADIUS
        );

        ctx.lineTo(
            childX,
            childY - NODE_RADIUS
        );

        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.stroke();

        drawTree(
            node.left,
            childY,
            leftOffsetX
        );
    }

    /* ===== 右孩子 ===== */

    if (node.right) {

        const rightOffsetX =
            offsetX +
            (node.left ? node.left.width : 0) +
            MIN_NODE_SAFE_SPACE;

        const childX =
            rightOffsetX + node.right.x;

        const childY =
            baseY + LEVEL_HEIGHT;

        ctx.beginPath();

        ctx.moveTo(
            actualX,
            actualY + NODE_RADIUS
        );

        ctx.lineTo(
            childX,
            childY - NODE_RADIUS
        );

        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.stroke();

        drawTree(
            node.right,
            childY,
            rightOffsetX
        );
    }

    /* ===== 阴影 ===== */

    ctx.beginPath();

    ctx.arc(
        actualX + 4,
        actualY + 4,
        NODE_RADIUS,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();


    /* ===== 节点渐变 ===== */

    const gradient =
        ctx.createRadialGradient(
            actualX - 6,
            actualY - 6,
            2,
            actualX,
            actualY,
            NODE_RADIUS
        );

    gradient.addColorStop(0, "#38bdf8");
    gradient.addColorStop(1, "#6366f1");

    ctx.beginPath();

    ctx.arc(
        actualX,
        actualY,
        NODE_RADIUS,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 3;
    ctx.stroke();


    /* ===== 数字 ===== */

    ctx.fillStyle = "#fff";

    ctx.font = "bold 16px Inter";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        node.value,
        actualX,
        actualY
    );
}



/* =========================
   绘制森林
========================= */

function drawForest(forest) {

    if (!forest || forest.length === 0)
        return;

    let totalWidth = 0;
    let maxDepth = 0;

    const layouts = [];

    forest.forEach(tree => {

        const width =
            calculateLayout(tree);

        const depth =
            getDepth(tree);

        layouts.push({
            tree,
            width
        });

        totalWidth += width + FOREST_GAP;

        maxDepth = Math.max(maxDepth, depth);
    });

    totalWidth =
        totalWidth -
        FOREST_GAP +
        PADDING * 2;

    canvas.width = Math.max(1200, totalWidth);

    canvas.height =
        maxDepth * LEVEL_HEIGHT +
        PADDING * 2;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let currentOffsetX = PADDING;

    layouts.forEach(({tree, width}) => {

        drawTree(
            tree,
            PADDING,
            currentOffsetX
        );

        currentOffsetX +=
            width +
            FOREST_GAP;
    });
}

</script>

</body>
</html>
